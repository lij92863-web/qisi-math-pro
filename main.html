<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奇思数学 Pro · LaTeX 题库</title>
    <script src="./vendor/tailwind/tailwind.js" integrity="sha384-igm5BeiBt36UU4gqwWS7imYmelpTsZlQ45FZf+XBn9MuJbn4nQr7yx1yFydocC/K" crossorigin="anonymous"></script>
    <!-- 运行时依赖已于 2026-07-24 本地化到 ./vendor/（原走 unpkg CDN，易因网络中断导致初始化失败） -->
    <link rel="stylesheet" href="./vendor/katex/katex.min.css" integrity="sha384-nH0MfJ44wi1dd7w6jinlyBgljjS8EJAh2JBoRad8a3VDw2K69vfaaqm4WnR+gXtA" crossorigin="anonymous">
    <script src="./vendor/katex/katex.min.js" integrity="sha384-CwjPRVHTvLiMBFjEoij+QZViMV5rhTOIp7CJzl24JEqpRDA1sJFHVXXLURktbYYp" crossorigin="anonymous"></script>
    <script src="./vendor/katex/contrib/auto-render.min.js" integrity="sha384-bjyGPfbij8/NDKJhSGZNP/khQVgtHUE5exjm4Ydllo42FwIgYsdLO2lXGmRBf5Mz" crossorigin="anonymous"></script>
    <script src="./vendor/vue/vue.global.prod.js" integrity="sha384-bkD9qcJiDlQRpeIQtZSHgyQEMvRBzmOI9lw2SZHkLOrliAdnLtxNIucoEAVG9QVA" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./vendor/vue-virtual-scroller/vue-virtual-scroller.css" integrity="sha384-PIWxQLH13FE3yKn8YrBWCcBRMkCKr2xW0XcqY9sNVhmihrqyXrdsWrcjZdqlnaWg" crossorigin="anonymous">
    <script src="./vendor/vue-virtual-scroller/vue-virtual-scroller.min.js" integrity="sha384-asaCxaI3GxogQlKm59ynOPR3hwB7hNOTYipFrlNUHdRM0BOQs5BRO8ix8clxlj6p" crossorigin="anonymous"></script>
    <script src="./vendor/dexie/dexie.min.js" integrity="sha384-vG8R9Zn5YZHCeXt9gLNp8MnsUCqmIy7HPxhdOdLGa/30/c8uZXFrrN0iKGID/ZvC" crossorigin="anonymous"></script>
    <script src="./vendor/jszip/jszip.min.js" integrity="sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG" crossorigin="anonymous"></script>
    <script src="./vendor/zip-js/zip.min.js" integrity="sha384-Tv/uK4P6eGeoQ4iu0W+HIKp3xLGXTbm3820RHTASei/15eBB5Lk5MLrpMSJb01fE" crossorigin="anonymous"></script>
    <script src="./vendor/pdfjs/pdf.min.js" integrity="sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e" crossorigin="anonymous"></script>
    <script src="./vendor/lucide/lucide.min.js" integrity="sha384-qhUDVxItfTfdldcM+OXATzmed102bu7gbQzEzi7677Xh/Swfmh1R3gajkj18PhRK" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./qisi-noto-serif-sc.css">
    <link rel="stylesheet" href="./app.css?v=middle-scroll-1">
    <link rel="stylesheet" href="./vendor/cropper/cropper.min.css" integrity="sha384-6LFfkTKLRlzFtgx8xsWyBdKGpcMMQTkv+dB7rAbugeJAu1Ym2q1Aji1cjHBG12Xh" crossorigin="anonymous">
    <link rel="stylesheet" href="./qisi-video-workspace.css?v=library-scroll-2">
    <link rel="stylesheet" href="./qisi-handout-composer.css?v=paper-coordinates-1">
    <link rel="stylesheet" href="./qisi-figure-editor.css?v=entry-workflow-1">
</head>
<body><div id="app"><p id="app-startup-status" role="status">正在启动题库…</p></div>
<script>
window.addEventListener('load', () => {
    const status = document.getElementById('app-startup-status');
    if (!status) return;
    status.setAttribute('role', 'alert');
    status.textContent = '题库启动失败，部分程序文件可能未加载。请刷新页面，或检查是否完整解压了项目。';
    const refresh = document.createElement('button');
    refresh.type = 'button';
    refresh.textContent = '刷新页面';
    refresh.addEventListener('click', () => window.location.reload());
    status.after(refresh);
}, { once: true });
</script>

    <!-- [组件1]: Icon -->
    <template id="icon-tpl">
        <span ref="el" class="inline-flex items-center justify-center shrink-0"></span>
    </template>

    <!-- [组件2]: KaTeX 渲染组件 (核心离线渲染) -->
    <template id="latex-preview-tpl">
        <div :class="['math-content clearfix', $props.class]" v-html="htmlContent"></div>
    </template>

    <!-- [组件3]: 侧边知识树 -->
    <template id="knowledge-tree-tpl">
        <div class="library-knowledge-tree text-[13px] text-gray-700 font-medium select-none">
            <div @click="select(null)" class="flex items-center gap-2 p-2 mb-2 rounded-lg cursor-pointer transition-colors" :class="activeNode === null ? 'bg-blue-50 text-blue-600 font-bold' : 'hover:bg-gray-50'">
                <icon name="layers" size="16"></icon> 全部题库
            </div>
            <div v-for="l1 in treeData" :key="l1.id" class="mb-1">
                <div class="flex items-center gap-1.5 p-1.5 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors" :class="{'bg-blue-50 text-blue-600': activeNode === nodeKey(l1)}">
                    <button @click.stop="toggle(l1)" class="tree-toggle-btn"><icon :name="l1.expanded ? 'chevron-down' : 'chevron-right'" size="14" class="text-gray-400"></icon></button>
                    <span @click="select(l1)" class="flex-1 truncate font-bold text-gray-800" :class="{'text-blue-600': activeNode === nodeKey(l1)}">{{l1.name}}</span>
                </div>
                <div v-show="l1.expanded" class="pl-2 border-l border-gray-100 ml-2 mt-0.5 flex flex-col gap-0.5">
                    <div v-for="l2 in l1.children" :key="l2.id">
                        <div class="flex items-center gap-1.5 p-1.5 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors text-[12px] font-bold text-gray-600" :class="{'bg-blue-50 text-blue-600': activeNode === nodeKey(l2)}">
                            <button @click.stop="toggle(l2)" class="tree-toggle-btn"><icon :name="l2.expanded ? 'chevron-down' : 'chevron-right'" size="12" class="text-gray-300"></icon></button>
                            <span @click="select(l2)" class="flex-1 truncate">{{l2.name}}</span>
                        </div>
                        <div v-show="l2.expanded" class="pl-4 flex flex-col gap-0.5 mt-0.5">
                            <div v-for="l3 in l2.children" :key="l3.id" @click="select(l3)" class="flex items-center gap-2 p-1.5 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors" :class="{'bg-blue-50 text-blue-600 font-bold': activeNode === nodeKey(l3)}">
                                <span class="flex-1 truncate text-[11px] text-gray-500 hover:text-blue-600" :class="{'text-blue-600 font-bold': activeNode === nodeKey(l3)}">{{l3.name}}</span>
                                <span v-if="counts[nodeKey(l3)]" class="library-tree-count text-[10px] text-gray-400">{{counts[nodeKey(l3)]}}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="system-knowledge-badge-tpl">
        <details v-if="path.length > 1" :key="path.join('/')"
            class="library-system-knowledge relative border border-blue-100 bg-blue-50 px-1.5 py-0.5 rounded-sm text-blue-600">
            <summary class="cursor-pointer">{{label}}：{{path[0]}}</summary>
            <ol class="absolute left-0 top-full z-20 mt-1 min-w-full whitespace-nowrap rounded-md border border-blue-100 bg-white px-3 py-2 shadow-md">
                <li v-for="(name, index) in path.slice(1)" :key="index">{{name}}</li>
            </ol>
        </details>
        <span v-else class="library-system-knowledge border border-blue-100 bg-blue-50 px-1.5 py-0.5 rounded-sm text-blue-600">
            {{label}}：{{path[0]}}
        </span>
    </template>

    <!-- [组件4]: 独立题目卡片 (引入全新高考式排版引擎) -->
    <template id="question-card-tpl">
        <div class="question-card group" tabindex="-1" @keydown="handleEditorUndo" :class="{'external-selected': externalMode && checked}" v-if="q && q.id">
            <div class="flex justify-between items-center pb-2 border-b border-gray-100 mb-2 flex-wrap gap-y-1">
                <div class="library-card-meta flex flex-wrap items-center gap-2">
                    <div class="flex items-center gap-1.5 text-[11px] font-bold text-gray-500 bg-gray-50 px-2 py-0.5 rounded-sm">
                        <span class="text-blue-600">{{isEditing ? previewQuestion.type : (q?.type || '解答题')}}</span>
                        <span class="text-gray-300">|</span>
                        <span class="text-orange-500">{{isEditing ? editDiff : (q?.meta?.diff || q?.diff || '中等')}}</span>
                        <span class="text-gray-300">|</span>
                        <span>{{isEditing ? editGrade : (q?.meta?.grade || q?.grade || '高一')}}</span>
                    </div>
                    <system-knowledge-badge v-if="cardKnowledge.systemPath.length" :path="cardKnowledge.systemPath"></system-knowledge-badge>
                    <span v-if="cardKnowledge.personal" class="library-personal-knowledge border border-green-100 bg-green-50 px-1.5 py-0.5 rounded-sm text-green-600">
                        个人知识点：{{cardKnowledge.personal}}
                    </span>
                    <span v-if="cardKnowledge.legacy || (!externalMode && !cardKnowledge.systemPath.length && !cardKnowledge.personal)"
                        class="library-knowledge-summary bg-gray-50 px-1.5 py-0.5 rounded-sm text-gray-600">
                        知识点：{{cardKnowledge.legacy || '未设置'}}
                    </span>
                    <button v-if="!externalMode && !pickMode" type="button" class="v-btn small"
                        :disabled="saving || aiSuggestion?.loading" @click="requestAi('metadata')">
                        <icon name="sparkles" size="12"></icon> AI 补全属性
                    </button>
                    <span
                        v-if="externalMode && externalStatus"
                        class="material-status-chip"
                        :class="externalStatusClassName"
                        :title="externalStatusTip">
                        {{ externalStatusText }}
                    </span>
                    <span
                        v-if="externalMode && externalProcessText && q.processStatus !== 'unprocessed'"
                        class="external-process-chip">
                        {{ externalProcessText }}
                    </span>
                    <div v-if="(q?.meta?.tags || q?.tags) && (q.meta?.tags || q.tags).length" class="text-[10px] text-gray-400 flex gap-1">
                        <span v-for="tag in (q.meta?.tags || q.tags)" :key="tag" class="border border-gray-100 px-1.5 py-0.5 rounded-sm">#{{tag}}</span>
                    </div>
                </div>
                
                <div v-if="externalMode" class="external-card-right">
                    <label v-if="pickMode" class="external-question-checkbox">
                        <input type="checkbox" :checked="checked" @change="handleTogglePick" />
                        <span></span>
                    </label>
                </div>

                <div v-else class="flex flex-wrap items-center gap-1">
                    <button @click="toggleEditor" class="px-2 py-0.5 bg-white border border-gray-200 rounded text-[11px] font-bold text-gray-600 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 transition-colors flex items-center gap-1">
                        <icon name="edit-3" size="10"></icon> {{ isEditing ? '取消' : '编辑' }}
                    </button>
                    <button @click="handleToggleAnswer" class="px-2 py-0.5 bg-white border border-gray-200 rounded text-[11px] font-bold text-gray-600 hover:bg-gray-50 transition-colors flex items-center gap-1" :disabled="!hasAnswer" :class="{'opacity-50 cursor-not-allowed': !hasAnswer}">
                        <icon :name="showAnswer ? 'eye-off' : 'check-circle'" size="10"></icon> {{ showAnswer ? '隐藏' : '解析' }}
                    </button>
                    <button @click="handleToggleCart" :class="['px-2 py-0.5 border rounded text-[11px] font-bold transition-colors flex items-center gap-1', isSelected ? 'bg-red-50 text-red-600 border-red-200 hover:bg-red-100' : 'bg-[#22a039] text-white border-[#22a039] hover:bg-[#1b802d]']">
                        <icon :name="isSelected ? 'minus' : 'plus'" size="10"></icon> {{ isSelected ? '移出' : '选题' }}
                    </button>
                </div>
            </div>

            <div>
                <figure-preview :images="isEditing ? editorImages : cardImages" :disabled="externalMode||pickMode" @layout="updateFigureLayout">
                    <question-preview :question="previewQuestion" :images="isEditing ? editorImages : cardImages" :show-answer="showAnswer"></question-preview>
                </figure-preview>
                <!-- 编辑模式 -->
                <div v-if="isEditing" :inert="saving" class="library-card-editor mt-3 p-3 bg-[#fcfcfd] border border-gray-200 rounded shadow-inner animate-fade-in">
                    <div class="grid grid-cols-3 gap-2 mb-3 border-b border-gray-100 pb-3 relative">
                        <select class="input-base text-[11px] py-1" v-model="editType"><option>解答题</option><option>单选题</option><option>多选题</option><option>填空题</option><option>证明题</option></select>
                        <select class="input-base text-[11px] py-1" v-model="editDiff"><option>容易</option><option>中等</option><option>较难</option><option>压轴</option></select>
                        <select class="input-base text-[11px] py-1" v-model="editGrade"><option>初一</option><option>初二</option><option>初三</option><option>高一</option><option>高二</option><option>高三</option></select>
                    </div>

                    <div class="grid grid-cols-2 gap-2 mb-3 border-b border-gray-100 pb-3">
                        <div class="material-field min-w-0">
                            <label v-for="level in editSystemLevels" :key="level.parentId" class="grid gap-1">
                                {{level.label}}
                                <select :value="level.value" :aria-label="level.label" @change="selectEditSystemKnowledge($event.target.value || level.parentId)">
                                    <option value="">{{ level.parentId ? '保留上级知识点' : '不选择' }}</option>
                                    <option v-if="level.value === 'legacy'" value="legacy">{{ editSystemKnowledge }}</option>
                                    <option v-for="node in level.nodes" :key="node.id" :value="node.id">{{ node.name }}</option>
                                </select>
                            </label>
                        </div>
                        <div class="material-field qisi-personal-tag">
                            <label>个人知识点
                                <select v-model="personalKnowledgeChoice" aria-label="个人知识点">
                                    <option value="">不选择</option>
                                    <option v-if="savedPersonalKnowledge.choice === 'current'" value="current">
                                        {{ savedPersonalKnowledge.label || '当前知识点' }}
                                    </option>
                                    <option v-if="personalKnowledgeChoice === 'manual'" value="manual">
                                        {{ editPersonalKnowledgeLabel }}（待保存）
                                    </option>
                                    <option v-for="node in flatPersonalKnowledge" :key="node.id" :value="'node:' + node.id">{{ node.path }}</option>
                                </select>
                            </label>
                            <label>手动修改个人知识点
                                <input v-model="editPersonalKnowledge" type="text" class="input-base" placeholder="多个知识点用反斜杠分隔">
                            </label>
                        </div>
                    </div>

                    <div class="flex flex-wrap justify-between items-center gap-2 mb-2">
                        <div class="flex gap-1.5">
                            <button v-for="tab in [{id: 'stem', name: '题干'}, {id: 'answer', name: '答案'}, {id: 'solution', name: '解析'}]" :key="tab.id" @click="editField(tab.id)" :aria-pressed="activeEditTab === tab.id" :class="['px-2.5 py-0.5 text-[11px] font-bold rounded transition-colors', activeEditTab === tab.id ? 'bg-[#1a73e8] text-white shadow-sm' : 'bg-white border border-gray-200 text-gray-600 hover:bg-gray-100']">
                                {{tab.name}}
                            </button>
                        </div>
                        <div class="flex flex-wrap items-center gap-2">
                            <button type="button" class="v-btn small" :disabled="!currentEditText.trim() || aiSuggestion?.loading"
                                @click="requestAi('calibration')"><icon name="sparkles" size="12"></icon> AI 校准 LaTeX</button>
                            <label class="cursor-pointer text-[11px] font-bold text-gray-500 bg-white border border-gray-200 px-2 py-0.5 rounded hover:bg-blue-50 hover:text-blue-600 transition-colors flex items-center gap-1 shadow-sm">
                                <icon name="image-plus" size="12"></icon> 插图 <input type="file" class="hidden" accept="image/*" @change="handleImageUploadEvent" />
                            </label>
                        </div>
                    </div>

                    <textarea
                        ref="editorText"
                        class="w-full h-24 p-2 bg-white border border-gray-200 rounded text-[12px] font-mono outline-none focus:border-blue-400 resize-none custom-scrollbar shadow-sm"
                        :aria-label="({stem: '题干源码', answer: '答案源码', solution: '解析源码'})[activeEditTab]"
                        v-model="currentEditText" @paste="handleEditPaste" placeholder="在此修改 LaTeX 源码..."
                    ></textarea>
                    
                    <section v-if="aiSuggestion" ref="aiPanel" class="library-card-ai"
                        :aria-label="aiSuggestion.mode === 'metadata' ? 'AI 属性建议' : 'LaTeX 校准对比'">
                        <p v-if="aiSuggestion.loading" role="status">{{aiSuggestion.mode === 'metadata' ? '正在生成属性建议…' : '正在校准源码并检查公式…'}}</p>
                        <p v-if="aiSuggestion.error" class="v-error" role="alert">{{aiSuggestion.error}}</p>
                        <p v-if="aiSuggestion.notice" role="status">{{aiSuggestion.notice}}</p>
                        <div v-if="aiSuggestion.fields" class="v-meta-suggestions">
                            <span v-for="item in aiMetadata" :key="item.field" v-show="aiSuggestion.fields[item.field]" class="v-tag">
                                {{item.label}} <b>{{aiSuggestion.fields[item.field]}}</b>
                            </span>
                            <div v-if="aiSuggestion.systemNode" class="inline-flex items-center gap-1">
                                <input v-model="aiSuggestion.useSystemKnowledge" type="checkbox" aria-label="采用建议的系统知识点">
                                <system-knowledge-badge label="建议系统知识点" :path="aiSuggestion.systemNode.path.split(' / ')"></system-knowledge-badge>
                            </div>
                            <template v-if="aiSuggestion.concepts.length">
                                <label class="inline-flex items-center gap-1">
                                    <input v-model="aiSuggestion.usePersonalKnowledge" type="checkbox">
                                    采用建议的个人知识点
                                </label>
                                <select v-model="aiSuggestion.knowledge" aria-label="建议个人知识点" :disabled="!aiSuggestion.usePersonalKnowledge">
                                    <option v-for="(concept, index) in aiSuggestion.concepts" :key="concept.name" :value="String(index)">
                                        {{concept.node ? concept.node.path || concept.node.name : concept.name + '（确认更新时添加）'}}
                                    </option>
                                </select>
                            </template>
                        </div>
                        <div v-if="aiSuggestion.value" class="v-calibration-compare">
                            <div><h4>当前源码</h4><pre>{{aiSuggestion.original}}</pre></div>
                            <div><h4>校准后预览</h4><latex-preview :content="aiSuggestion.value" :images="editImages" preserve-line-breaks></latex-preview></div>
                        </div>
                        <div class="v-row">
                            <button v-if="aiSuggestion.fields || aiSuggestion.value" type="button" class="v-btn primary small"
                                @click="applyAiSuggestion">{{aiSuggestion.mode === 'metadata' ? '应用建议' : '采用校准'}}</button>
                            <button type="button" class="v-btn small" @click="clearAiSuggestion">丢弃</button>
                        </div>
                    </section>
                    <p v-if="saveError" role="alert" class="text-sm text-red-600">{{saveError}}</p>
                </div>
                <div v-if="!externalMode && !pickMode" class="mt-3 flex flex-wrap items-center justify-end gap-2 border-t border-gray-100 pt-2">
                    <button v-if="isEditing" type="button" class="v-btn small" :disabled="saving || !undoHistory.length" @click="undoEditor" title="Ctrl+Z">撤回</button>
                    <button v-if="isEditing" type="button" class="v-btn small" :disabled="saving || !redoHistory.length" @click="redoEditor" title="Ctrl+Y 或 Ctrl+Shift+Z">重做</button>
                    <button type="button" @click="handleDelete" :disabled="saving" class="px-2 py-1 text-[11px] font-bold text-gray-600 hover:text-red-600 disabled:opacity-50">
                        移出题库
                    </button>
                    <button v-if="isEditing" type="button" @click="handleSaveProps" :disabled="saving"
                        class="text-[11px] text-white bg-[#1a73e8] hover:bg-blue-700 flex items-center gap-1.5 font-bold px-3 py-1 rounded shadow-sm transition-colors disabled:opacity-50">
                        <icon name="save" size="12"></icon> {{saving?'正在保存…':'确认更新'}}
                    </button>
                </div>
            </div>
        </div>
    </template>

    <!-- [组件5]: 主应用布局 -->
    <template id="app-tpl">
        <div v-if="databaseStatus" role="alert" class="fixed inset-0 z-[100] bg-white/95 flex flex-col gap-4 items-center justify-center p-8">
            <p v-if="databaseStatus==='opening'">正在打开题库与讲义存储…</p>
            <p v-else-if="databaseStatus==='blocked'">数据库升级正在等其他标签页释放连接。请关闭同一题库的其他标签页或窗口，升级会自动继续。</p>
            <p v-else-if="databaseStatus==='outdated'">本页已释放数据库连接，让另一个标签页完成升级。请在升级完成后刷新本页。</p>
            <p v-else>题库数据库打开失败。请刷新重试，并确认浏览器允许本地站点保存数据。</p>
            <button v-if="!['blocked','opening'].includes(databaseStatus)" type="button" class="v-btn primary" @click="reloadDatabasePage">刷新页面</button>
        </div>
        <div v-if="backupStatus.restoring" role="status" class="fixed inset-0 z-[100] bg-white/90 flex items-center justify-center text-lg">正在处理备份恢复，请等待完成。</div>
        <div class="app-container" :inert="backupStatus.restoring||!!databaseStatus">
            <div v-if="backupStatus.needsPermission" class="bg-amber-100 text-amber-900 px-4 py-2 flex gap-3 items-center text-sm" role="status">
                <span>自动备份已暂停，需要重新授权「{{ backupStatus.folderName }}」。</span>
                <button type="button" class="border border-amber-700 rounded px-2 py-1" :disabled="backupStatus.busy || backupStatus.reading" @click="backupWorkspace.resumeAutomatic">重新授权</button>
            </div>
<header class="v-topnav">
 <button class="v-brand" @click="videoNav('library')"><span class="v-logo">∑</span>奇思数学 <b>LaTeX 题库</b></button>
 <nav aria-label="主导航">
  <button @click="videoNav('library')" :aria-current="view==='library'?'page':null"><icon name="database" size="18"></icon>题库</button>
  <button @click="videoOpenComposer('试卷')" :aria-current="view==='handout'&&video.documentTerm==='试卷'?'page':null"><icon name="file-text" size="18"></icon>试卷</button>
  <button @click="videoOpenComposer('讲义')" :aria-current="view==='handout'&&video.documentTerm==='讲义'?'page':null"><icon name="files" size="18"></icon>讲义</button>
  <button @click="videoNav('entry')" :aria-current="view==='entry'?'page':null"><icon name="file-plus" size="18"></icon>单题录入</button>

                            </div>
                        </div>
                    </div>
